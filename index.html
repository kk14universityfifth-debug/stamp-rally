let spot = "";
let sub = "";

  kids:[81,283],
  edu:[268,283],
  welfare_dis:[456,283],
  welfare_old:[644,283],
  health:[832,283],
  global:[1020,283],

function getParam(name){
  return new URL(location.href).searchParams.get(name);
}

async function init(){

  // URLからspot取得
spot = getParam("spot");

// 取得できたら保存
if(spot){
  sessionStorage.setItem("spot", spot);
}

// 消えてたら保存済みを使う
if(!spot){
  spot = sessionStorage.getItem("spot");
}

console.log("① spot:", spot);
  console.log("① spot:", spot);
  
  await liff.init({
    liffId: LIFF_ID
  });

  if(!liff.isLoggedIn()){
    liff.login();
    return;
  }

  // 👇ここ追加
  const profile = await liff.getProfile();
  userId = profile.userId;

  const idToken = liff.getIDToken();

try {
  if(idToken){
    const payload = JSON.parse(atob(idToken.split('.')[1]));
    sub = payload.sub || "";
  } else {
    sub = "";
  }
} catch(e) {
  console.log("sub取得エラー:", e);
  sub = "";
}
  
  console.log("userId:", userId);
  console.log("sub:", sub);
  

  // スタンプ情報取得
  const res = await fetch(
    GAS_URL + "?mode=spot&spot=" + spot
  );

  const data = await res.json();

  console.log("② data:", data);
  
  if(data.length === 0){

    document.getElementById("title")
      .innerText = "活動が見つかりません";

    return;

  }

  if(!data || data.length === 0){

  document.getElementById("title")
    .innerText = "活動が見つかりません";

  console.log("❌ data empty");

  return;
}
  
  document.getElementById("title").innerText =
    "📍 " + data[0].activity;

  // 表示
  data.forEach(s=>{

    const div = document.createElement("div");
    div.className = "stamp";

    div.innerHTML = `
      <img src="${s.image}">
      <div>
        <b>${s.name}</b><br>
        ${s.activity}
      </div>
    `;

    document.getElementById("stampArea")
      .appendChild(div);

  });

  stamps = data;

  const genreRes = await fetch(
  GAS_URL + "?mode=genres"
);

allGenres =
  await genreRes.json();

  // 取得済み確認
  let userData = [];

try {
  const userRes = await fetch(
    GAS_URL + "?mode=user&userId=" + userId
  );
  userData = await userRes.json();
} catch(e) {
  console.log("ユーザー取得エラー:", e);
}

  await drawStampBook(userData);
  
  const allAlready = stamps.every(
    s => userData.includes(s.id)
  );

  const btn =
  document.getElementById("btn");

  if(allAlready){

    document.getElementById("status")
      .innerText = "⚠️ 取得済みです";

  }else{

    document.getElementById("status")
      .innerText = "取得できます！";

    btn.style.display = "inline-block";
    btn.disabled = false;

  }

}

async function drawStampBook(userData){

  const canvas =
    document.getElementById("stampBook");

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(
  0,
  0,
  canvas.width,
  canvas.height
);
  
  // 台紙
  const base = new Image();

  base.src =
    "https://kk14universityfifth-debug.github.io/stamp-rally/images/stampbook.png";

  await new Promise(r=>{
    base.onload = r;
    base.onerror = r;
  });

  ctx.drawImage(base,0,0);

  // スタンプ
  for(const s of allGenres){

    if(userData.includes(s.id)){

      const img = new Image();

      img.src = s.image;

      await new Promise(r=>{
        img.onload = r;
      });

      const pos =
        stampPositions[s.id];

      ctx.drawImage(
        img,
        pos[0],
        pos[1],
        118,
        155
      );

    }

  }

}

async function send(){

  document.getElementById("btn")
    .disabled = true;

  document.getElementById("status")
    .innerText = "送信中...";

  try{

    console.log("fetch前");

    const formData = new URLSearchParams();

    formData.append("userId", userId);
    formData.append("sub", sub);

    formData.append(
      "stamps",
      JSON.stringify(
        stamps.map(s=>s.id)
      )
    );

    const res = await fetch(GAS_URL,{

    });
